<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIX · Liquid Glass</title>
    <style>
        /* ===== CSS 变量与全局重置 ===== */
        :root {
            --bg-deep: #0a0a0f;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #e8e8ed;
            --text-secondary: #9898a0;
            --accent: #5e8bff;
            --accent-glow: rgba(94, 139, 255, 0.25);
            --radius-lg: 28px;
            --radius-md: 18px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
            --font-sans: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition-smooth: 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== 动态背景光晕 ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 25%, rgba(94, 139, 255, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse 60% 70% at 82% 70%, rgba(160, 120, 255, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 120, 180, 0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== SVG 滤镜（隐形，供引用） ===== */
        .hidden-svg {
            position: absolute;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        /* ===== 主布局容器 ===== */
        .main-container {
            position: relative;
            z-index: 1;
            width: 90vw;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 36px;
            padding: 40px 0;
        }

        /* ===== TIX 头部区域 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 14px;
        }

        .logo-tix {
            font-family: var(--font-mono);
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, #e0e7ff 0%, #a0b8ff 50%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 28px rgba(130, 150, 255, 0.5));
            line-height: 1;
        }

        .logo-sub {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 2px;
        }

        /* 矽忈 签名 */
        .xi-ren-tag {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 16px 7px 12px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            transition: var(--transition-smooth);
            cursor: default;
            white-space: nowrap;
        }
        .xi-ren-tag:hover {
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 24px rgba(160, 130, 255, 0.18);
        }
        .xi-ren-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #c4b5fd;
            box-shadow: 0 0 10px #a78bfa;
            animation: dotPulse 2.6s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.6);
            }
        }

        /* ===== 液态玻璃卡片通用样式 ===== */
        .glass-card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(28px) saturate(1.6);
            -webkit-backdrop-filter: blur(28px) saturate(1.6);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow:
                0 16px 48px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            overflow: hidden;
            transition: var(--transition-smooth);
            filter: url(#liquid-glass-distortion);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 2;
        }

        .glass-card::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.06) 0%, transparent 65%);
            animation: liquidShine 10s infinite linear;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes liquidShine {
            0% {
                transform: rotate(0deg) translate(0, 0);
            }
            50% {
                transform: rotate(180deg) translate(30px, 30px);
            }
            100% {
                transform: rotate(360deg) translate(0, 0);
            }
        }

        .glass-card>* {
            position: relative;
            z-index: 3;
        }

        /* ===== 导航卡片行 ===== */
        .cards-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }

        .nav-card {
            cursor: pointer;
            padding: 32px 28px 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-decoration: none;
            color: inherit;
            transition: var(--transition-smooth);
            position: relative;
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: var(--radius-lg);
            box-shadow:
                0 12px 36px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            filter: url(#liquid-glass-distortion);
            overflow: hidden;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 20% 15%, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .nav-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow:
                0 24px 56px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 0 60px rgba(94, 139, 255, 0.12);
        }

        .nav-card:hover .card-arrow {
            transform: translateX(6px);
            opacity: 1;
        }

        .nav-card-icon {
            font-size: 2rem;
            position: relative;
            z-index: 3;
        }

        .nav-card-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            position: relative;
            z-index: 3;
        }

        .nav-card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.55;
            position: relative;
            z-index: 3;
        }

        .card-arrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: var(--transition-smooth);
            opacity: 0.7;
            position: relative;
            z-index: 3;
        }

        /* ===== AI 指引面板 ===== */
        .ai-panel {
            padding: 28px 32px;
        }
        .ai-panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .ai-panel-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .ai-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #5ef78c;
            box-shadow: 0 0 14px #5ef78c;
            animation: dotPulse 2.2s ease-in-out infinite;
        }
        .ai-chat-area {
            background: rgba(0, 0, 0, 0.28);
            border-radius: var(--radius-md);
            padding: 20px;
            min-height: 160px;
            max-height: 320px;
            overflow-y: auto;
            font-size: 0.88rem;
            line-height: 1.7;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .ai-chat-area .msg {
            padding: 10px 14px;
            border-radius: 14px;
            max-width: 85%;
            word-break: break-word;
        }
        .msg.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #d0d0d8;
        }
        .msg.user {
            align-self: flex-end;
            background: rgba(94, 139, 255, 0.15);
            border: 1px solid rgba(94, 139, 255, 0.25);
            color: #e0e4ff;
        }
        .ai-input-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .ai-input-row input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.35);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition-smooth);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .ai-input-row input:focus {
            border-color: rgba(94, 139, 255, 0.5);
            box-shadow: 0 0 20px rgba(94, 139, 255, 0.12);
        }
        .ai-input-row button {
            padding: 12px 22px;
            border-radius: 40px;
            border: 1px solid rgba(94, 139, 255, 0.35);
            background: rgba(94, 139, 255, 0.12);
            color: #c8d4ff;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            letter-spacing: 0.03em;
        }
        .ai-input-row button:hover {
            background: rgba(94, 139, 255, 0.22);
            border-color: rgba(94, 139, 255, 0.55);
            box-shadow: 0 0 28px rgba(94, 139, 255, 0.2);
        }
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .quick-chip {
            padding: 7px 15px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            white-space: nowrap;
        }
        .quick-chip:hover {
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.07);
            color: #d0d0da;
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-secondary);
            opacity: 0.5;
            letter-spacing: 0.06em;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }
        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer a:hover {
            color: #c0c8e0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .logo-tix {
                font-size: 2.8rem;
            }
            .cards-row {
                grid-template-columns: 1fr;
            }
            .main-container {
                padding: 24px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 隐形 SVG 滤镜：液态玻璃扭曲效果 -->
    <svg class="hidden-svg" xmlns="http://www.w3.org/2000/svg">
        <filter id="liquid-glass-distortion" x="-20%" y="-20%" width="140%" height="140%"
        filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.009" numOctaves="2" seed="7"
        result="turbulence">
        <animate attributeName="seed" values="3;11;3" dur="14s" repeatCount="indefinite" />
    </feTurbulence>
    <feGaussianBlur in="turbulence" stdDeviation="2.5" result="blurredNoise" />
    <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="28"
    xChannelSelector="R" yChannelSelector="G" result="displaced" />
</filter>
</svg>

<!-- ===== 主容器 ===== -->
<div class="main-container">

    <!-- 头部：TIX + 矽忈签名 -->
    <header class="header">
        <div class="logo-area">
            <span class="logo-sub">未来制造</span>
            <h1 class="logo-tix">TIX</h1>
        </div>
        <div class="xi-ren-tag" title="抖音 · 矽忈">
            <span class="xi-ren-dot"></span>
            <span>抖音 · 矽忈</span>
        </div>
    </header>

    <!-- 导航卡片：跳转两个原始页面 -->
    <div class="cards-row">
        <!-- 卡片 1：正式版 -->
        <a class="nav-card" href="https://tixmakefuture.github.io/actualuse" target="_blank"
        rel="noopener noreferrer">
        <span class="nav-card-icon">🌐</span>
        <span class="nav-card-title">正式版 · Actual Use</span>
        <span class="nav-card-desc">稳定版本，完整功能体验，适用于日常使用场景。</span>
        <span class="card-arrow">进入 →</span>
    </a>

    <!-- 卡片 2：测试版 -->
    <a class="nav-card" href="https://tixmakefuture.github.io/beta" target="_blank"
    rel="noopener noreferrer">
    <span class="nav-card-icon">🧪</span>
    <span class="nav-card-title">测试版 · Beta</span>
    <span class="nav-card-desc">尝鲜预览，最新功能抢先体验，仅供内部测试。</span>
    <span class="card-arrow">进入 →</span>
</a>
</div>

<!-- AI 指引面板 -->
<div class="glass-card ai-panel">
    <div class="ai-panel-header">
        <span class="ai-indicator"></span>
        <h3>TIX 智能指引</h3>
    </div>
    <div class="ai-chat-area" id="chatArea">
        <div class="msg ai">👋 你好！我是 TIX 智能助手。有什么可以帮你的？你可以问我关于页面功能、导航指引，或者任何你需要了解的事情。</div>
    </div>
    <div class="ai-input-row">
        <input type="text" id="chatInput" placeholder="输入你的问题…" autocomplete="off" />
        <button id="sendBtn">发送</button>
    </div>
    <div class="quick-actions" id="quickActions">
        <span class="quick-chip" data-msg="这个网站是做什么的？">📌 网站介绍</span>
        <span class="quick-chip" data-msg="正式版和测试版有什么区别？">🔄 版本区别</span>
        <span class="quick-chip" data-msg="如何开始使用？">🚀 快速上手</span>
        <span class="quick-chip" data-msg="矽忈是谁？">👤 关于矽忈</span>
    </div>
</div>

<!-- 页脚 -->
<footer class="footer">
    <span>© 2026 TIX · 未来制造</span>
    <a href="https://tixmakefuture.github.io/actualuse" target="_blank" rel="noopener noreferrer">正式版</a>
    <a href="https://tixmakefuture.github.io/beta" target="_blank" rel="noopener noreferrer">测试版</a>
    <span>抖音 · 矽忈</span>
</footer>
</div>

<!-- ===== AI 指引交互脚本 ===== -->
<script>
    (function() {
        const chatArea = document.getElementById('chatArea');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const quickChips = document.querySelectorAll('.quick-chip');

        // 知识库：预定义的指引回答
        const knowledgeBase = {
            '网站介绍': '🌐 **TIX** 是一个面向未来的智能平台，融合了先进的液态玻璃界面设计与实用功能。目前提供正式版与测试版两个版本，满足不同用户的需求。',
            '版本区别': '🔄 **正式版** 是稳定发布版本，适合日常使用；**测试版** 包含最新功能但可能不稳定，仅供内部测试与尝鲜体验。点击上方卡片即可跳转对应版本。',
            '快速上手': '🚀 点击上方 **正式版** 卡片即可进入主站。如果在使用过程中有任何疑问，可以随时在这里向我提问，我会尽力提供指引。',
            '关于矽忈': '👤 **矽忈** 是 TIX 团队的核心成员，你可以在抖音上找到他。他是重装上阵玩家社区的活跃建设者，欢迎关注交流！',
            'default': '感谢你的提问！你可以点击下方的快捷按钮，或者输入「网站介绍」「版本区别」「快速上手」「关于矽忈」来获取更多信息。如果问题比较复杂，建议访问正式版页面获取详细帮助。'
        };

        // 添加消息到聊天区域
        function addMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg ' + type;
            // 简单 Markdown 加粗处理
            msgDiv.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 处理用户输入
        function handleUserInput(inputText) {
            if (!inputText.trim()) return;
            addMessage(inputText, 'user');

            // 模拟 AI 思考延迟
            const delay = 400 + Math.random() * 600;
            setTimeout(() => {
                let response = knowledgeBase['default'];
                const lowerInput = inputText.toLowerCase();
                if (lowerInput.includes('介绍') || lowerInput.includes('做什么')) {
                    response = knowledgeBase['网站介绍'];
                } else if (lowerInput.includes('版本') || lowerInput.includes('区别') || lowerInput.includes(
                        '正式') || lowerInput.includes('测试')) {
                    response = knowledgeBase['版本区别'];
                } else if (lowerInput.includes('上手') || lowerInput.includes('开始') || lowerInput.includes('使用')) {
                    response = knowledgeBase['快速上手'];
                } else if (lowerInput.includes('矽忈') || lowerInput.includes('xi') || lowerInput.includes('抖音')) {
                    response = knowledgeBase['关于矽忈'];
                }
                addMessage(response, 'ai');
            }, delay);
        }

        // 发送按钮事件
        sendBtn.addEventListener('click', () => {
            const text = chatInput.value;
            chatInput.value = '';
            handleUserInput(text);
        });

        // 回车发送
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const text = chatInput.value;
                chatInput.value = '';
                handleUserInput(text);
            }
        });

        // 快捷操作
        quickChips.forEach(chip => {
            chip.addEventListener('click', () => {
                const msg = chip.getAttribute('data-msg');
                handleUserInput(msg);
            });
        });

        // 初始聚焦
        chatInput.focus();
    })();
</script>
</body>
</html>
